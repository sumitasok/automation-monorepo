<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="explorer-source" content="">
<title>Portfolio — tax explorer</title>
<style>
  :root {
    --bg:#fbfbfa; --fg:#1a1a19; --dim:#6b6b68; --line:#e4e4e1; --card:#fff;
    --go:#1a7f4b; --ok:#1a7f4b; --caution:#b8860b; --stop:#b3261e;
    --neutral:#6b6b68; --buy:#1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#eeeeec; --dim:#a0a09c; --line:#2f2f2d; --card:#1e1e1c;
            --go:#4ade80; --ok:#4ade80; --caution:#fbbf24; --stop:#f87171;
            --neutral:#a0a09c; --buy:#7dd3fc; }
  }
  * { box-sizing:border-box }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif }
  main { max-width:70rem; margin:0 auto }
  h1 { font-size:1.5rem; margin:0 0 .25rem }
  .sub { color:var(--dim); font-size:.875rem; margin-bottom:1.5rem }
  .banner { padding:.75rem 1rem; border-radius:.5rem; margin-bottom:1.5rem;
            border:1px solid var(--line); background:var(--card); font-size:.875rem }
  .banner.warn { border-color:var(--caution); color:var(--caution) }
  .banner.stop { border-color:var(--stop); color:var(--stop) }
  .pos { margin:2rem 0 1rem; padding-top:1rem; border-top:1px solid var(--line) }
  .pos h2 { font-size:1.15rem; margin:0 0 .25rem }
  .grid { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fill,minmax(19rem,1fr)) }
  .lot { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--neutral);
         border-radius:.5rem; padding:.85rem 1rem }
  .lot.go,.lot.ok { border-left-color:var(--go) }
  .lot.caution { border-left-color:var(--caution) }
  .lot.stop { border-left-color:var(--stop) }
  .lot.buy { border-left-color:var(--buy) }
  .lot h3 { font-size:.95rem; margin:0 0 .35rem; display:flex; justify-content:space-between; gap:.5rem }
  .pill { font-size:.7rem; padding:.15rem .5rem; border-radius:1rem; white-space:nowrap;
          border:1px solid currentColor }
  .go .pill,.ok .pill { color:var(--go) } .caution .pill { color:var(--caution) }
  .stop .pill { color:var(--stop) } .buy .pill { color:var(--buy) } .neutral .pill { color:var(--neutral) }
  .facts { font-size:.8rem; color:var(--dim); margin:.35rem 0 }
  .why { font-size:.82rem; margin:.5rem 0 0 }
  .gauge { height:5px; background:var(--line); border-radius:3px; margin:.55rem 0 0; overflow:hidden }
  .gauge i { display:block; height:100%; }
  .flag { font-size:.75rem; color:var(--caution); margin-top:.4rem }
  table { border-collapse:collapse; width:100%; font-size:.8rem; margin-top:.75rem }
  .scroll { overflow-x:auto }
  th,td { text-align:right; padding:.3rem .5rem; border-bottom:1px solid var(--line); white-space:nowrap }
  th:first-child,td:first-child { text-align:left }
  .legend { margin-top:2.5rem; font-size:.82rem; color:var(--dim) }
  .legend li { margin:.3rem 0 }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85em }
</style>
</head>
<body>
<main>
  <h1>Portfolio — tax explorer</h1>
  <div class="sub" id="sub"></div>
  <div id="banners"></div>
  <div id="body"></div>
  <div class="legend" id="legend"></div>
</main>

<!-- The page's SOLE input. Filled at build time with the data document, or
     left empty for the fetch-configured variant. No figure is ever written
     into the markup itself (FR-036). -->
<script id="explorer-data" type="application/json">{}</script>
<!--FALLBACK-->

<script>
"use strict";
const SUPPORTED_MAJOR = 1;

function parseBlock(id) {
  const el = document.getElementById(id);
  if (!el || !el.textContent.trim()) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

function banner(cls, html) {
  document.getElementById("banners").insertAdjacentHTML(
    "beforeend", `<div class="banner ${cls}">${html}</div>`);
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const pc = x => (x * 100).toFixed(1) + "%";
const dt = s => { const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }); };

function ageOf(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return `${days} days ago`;
}

function render(D, source) {
  const major = parseInt(String(D.contract_version).split(".")[0], 10);
  if (major !== SUPPORTED_MAJOR) {
    // Refuse plainly rather than rendering wrong or partial figures (FR-040).
    banner("stop", `This page understands data format <code>${SUPPORTED_MAJOR}.x</code> but the
      document is <code>${esc(D.contract_version)}</code>. Refusing to render figures —
      regenerate the page from the pack that produced this document.`);
    return;
  }

  // Freshness comes from the pack's run, never from being viewed (FR-066).
  document.getElementById("sub").innerHTML =
    `Valued ${dt(D.valuation_date)} · generated ${ageOf(D.generated_at)} · ${esc(source)}`;

  if (D.withheld && D.withheld.length) {
    banner("warn", `<strong>Redacted copy.</strong> Withheld: ${D.withheld.map(esc).join(", ")}.
      These figures are absent from this file, not merely hidden.`);
  }
  if (D.flags_present) {
    banner("warn", "Some figures rest on unverified inputs — marked ⚠ below. Verify before filing.");
  }

  const out = [];
  for (const p of D.positions) {
    out.push(`<section class="pos"><h2>${esc(p.ticker)}</h2>`);
    if (!p.priced) {
      out.push(`<div class="sub">No market price recorded — this position is
        <strong>unpriced</strong> and excluded from value totals. It is not worth zero.</div>`);
    } else {
      out.push(`<div class="sub">spot ${p.spot} · fx ${p.fx} · ${p.lots.length} open lot(s)</div>`);
    }
    out.push(`<div class="grid">`);
    for (const l of p.lots) {
      const tone = (D.ratings.find(r => r.code === l.rating) || {}).tone || "neutral";
      const icon = (D.ratings.find(r => r.code === l.rating) || {}).icon || "";
      const label = (D.ratings.find(r => r.code === l.rating) || {}).label || l.rating;
      // Gauge is inverted relative to cushion and saturates at 25%: a big
      // cushion means selling now is expensive, so it renders long.
      const width = l.cushion == null ? 0 : Math.min(Math.abs(l.cushion) / 0.25, 1) * 100;
      out.push(`<article class="lot ${tone}">
        <h3><span>${esc(l.id)}</span><span class="pill">${icon} ${esc(label)}</span></h3>
        <div class="facts">${esc(l.funding)} · acquired ${dt(l.acq)} · matures ${dt(l.mat)}
          ${l.qty != null ? " · " + l.qty + " sh" : ""}</div>
        ${l.cushion != null ? `<div class="facts">can fall <strong>${pc(Math.abs(l.cushion))}</strong>
           before waiting stops paying</div>
          <div class="gauge"><i style="width:${width}%;background:var(--${tone})"></i></div>` : ""}
        ${l.why ? `<p class="why">${esc(l.why)}</p>` : ""}
        ${(l.flags || []).map(f => `<div class="flag">⚠ ${esc(f.note)}</div>`).join("")}
      </article>`);
    }
    out.push(`</div>`);

    if (p.closed && p.closed.length) {
      out.push(`<div class="scroll"><table><thead><tr><th>From lot</th><th>Acquired</th>
        <th>Disposed</th><th>Held</th><th>Rate</th></tr></thead><tbody>`);
      for (const c of p.closed) {
        out.push(`<tr><td>${esc(c.from_lot)}</td><td>${dt(c.acq)}</td><td>${dt(c.disp)}</td>
          <td>${c.holding_days}d</td><td>${c.long_term ? "LTCG" : "STCG"}</td></tr>`);
      }
      out.push(`</tbody></table></div>`);
    }
    out.push(`</section>`);
  }
  document.getElementById("body").innerHTML = out.join("");

  document.getElementById("legend").innerHTML =
    `<h2 style="font-size:1rem">How each batch is rated</h2><ul>` +
    D.ratings.map(r => `<li><strong>${r.icon} ${esc(r.label)}</strong> — ${esc(r.cond)}.
      ${esc(r.plain)}</li>`).join("") +
    `</ul><p>Green means you can sell cheaply; red means selling now is expensive.
     These are arithmetic on your own data — no forecast, no view on any company.</p>`;
}

(function start() {
  const embedded = parseBlock("explorer-data");
  const fallback = parseBlock("explorer-fallback");
  const url = (document.querySelector('meta[name="explorer-source"]') || {}).content;

  if (embedded && embedded.positions) { render(embedded, "embedded data"); return; }

  if (url) {
    fetch(url)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => render(d, "fetched " + url))
      .catch(() => {
        if (fallback) {
          banner("warn", `Could not reach <code>${esc(url)}</code>. Showing the copy built
            into this page, generated ${ageOf(fallback.generated_at)}.`);
          render(fallback, "fallback (embedded)");
        } else {
          banner("stop", `Could not reach <code>${esc(url)}</code> and this page carries no
            fallback copy. Nothing to show.`);
        }
      });
    return;
  }
  banner("stop", "This page has no data. Regenerate it with <code>portfolio report</code>.");
})();
</script>
</body>
</html>
