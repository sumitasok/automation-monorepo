# Config contract for the expenses pack.
#
# This file is COMMITTED here (no secrets — only declarations and placeholders).
# Real values live in the workspace at config/expenses/ (git-ignored) and are
# injected by `auto run` before this app is called.
#
#   auto config init expenses   # scaffold config/expenses/config.yaml
#   auto config expenses        # show which are set / missing
#
# See docs/adr/0007-pack-config-injection.md,
# docs/adr/0011-expenses-pack.md, and docs/adr/0019-pack-data-files.md.

# env: keys exported into the process environment before the app runs.
env:
  # Required for `update-event` (all runs, including --dry-run — matching
  # still needs the model). Only DeepSeek is implemented today; the Matcher
  # Strategy interface leaves room for others.
  DEEPSEEK_API_KEY: ""

  # Optional; overrides the built-in default model (deepseek-v4-flash).
  DEEPSEEK_MODEL: ""

  # Optional; "deepseek" (default, only one implemented).
  AI_PROVIDER: ""

# files: this pack declares no secrets.
files: []

# data_files: produced data this pack reads/writes at the CLI's default
# relative paths (config/events.json, state.json — see main.go's --events/
# --state flag defaults). auto run symlinks these from data/expenses/ into
# the pack's workdir before every run, so the real bytes always live under
# the workspace's data/ and packs/expenses/ itself stays read-only (ADR
# 0019 — this pack previously shipped these files committed directly inside
# itself; that was reverted, see ADR 0011 and ADR 0018 Amendment 2).
#   data/expenses/events.json — the event registry, versioned (commit it).
#   data/expenses/state.json  — the assignment ledger, local (git-ignored).
data_files:
  - config/events.json
  - state.json
