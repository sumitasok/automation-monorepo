id: wallet-dedup
name: Wallet record deduplication
description: >
  Identify, review, and remove duplicate transaction records from the local
  records.jsonl mirror. Four sub-operations: scan (detect), review (collect user decisions),
  execute (save deletion plan), finalize (delete from API + update records).
  Requires explicit user confirmation before deletion. Backups are created
  automatically; audit trail is appended to state.json.
category: wallet
owner: sumit
language: go
exec: "go run . dedup"              # app-backed job; user selects subcommand
workdir: "."                        # run in the pack (app) root
tags: [wallet, finance, dedup]
visibility: private

runs_on:
  os: [macos, linux]
  machines: []                      # on-demand only (not scheduled)

schedule:
  enabled: false                    # manual invocation only

runtime:
  timeout_seconds: 300              # 5 minutes max for full workflow
  env: []                           # no extra env vars needed (uses config injection)

data:
  reads:  [records.jsonl]           # fetched Wallet records (from wallet-fetch)
  writes: [records.jsonl, state.json] # updates records + audit trail
  # Backups are created as records.jsonl.backup.{timestamp} (see dedup logic)

health:
  expect_run_every: never           # manual operation, not scheduled
