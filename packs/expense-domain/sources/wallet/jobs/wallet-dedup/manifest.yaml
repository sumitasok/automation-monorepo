id: wallet-dedup
name: Wallet Deduplication
description: Interactive deduplication of wallet records with backup and reverting capability

language: go
runtime: go1.21+

entrypoint: main

schedule: manual

data:
  reads:
    - wallet/records.jsonl
  writes:
    - backups/wallet-dedup/

config:
  requires:
    - config/wallet/config.yaml

environment:
  - CONFIG_PATH
  - WALLET_API_TOKEN

tags:
  - wallet
  - maintenance
  - interactive

docs: |
  Interactive wallet deduplication with safe backup and revert capability.

  Features:
  - Shows each duplicate pair
  - Asks for manual approval for each dedup
  - Creates backup before any changes
  - Executes real API deletions and updates
  - Complete revert instructions saved

  Usage:
    auto run wallet-dedup

  The script will:
  1. Fetch real records from Wallet API
  2. Find duplicates (same merchant/amount/date)
  3. Interactively ask you to approve each dedup
  4. Create backup before execution
  5. Execute approved changes on real wallet
